# nginx 反代配置 —— agent-tool-layer 联网搜索工具层后端
#
# 设计目标:nginx 作为唯一入口(宿主端口 28082,见 docker-compose.yml),
# 把 searxng 与 jina 伪装成一个服务对外。
#
# 路由规则:
#   - searxng:原样转发(它本身是完整应用,有自己的 /search、/config、/static、/preferences 等路由),
#             不剥前缀、不改路径,searxng 所有的原始 URL 都保留。
#   - jina:  外部 /read/** 剥离 /read 前缀后,映射到 jina 的根路径 /<url>(jina API 按 /<url> 读取该 URL)。
#
# 内部服务(searxng / jina)均不直接暴露到宿主。
# 限流由 nginx 承担(limit_req),按客户端 IP 限频;searxng 关闭自身 limiter。

# 单机限流:按客户端 IP,默认 5 请求/秒、突发 10(可调)
limit_req_zone $binary_remote_addr zone=search_ratelimit:10m rate=5r/s;

# Docker 内嵌 DNS:让 upstream 在容器重建换 IP 后能自动重新解析(避免 502)
resolver 127.0.0.11 valid=10s ipv6=off;

# 上游后端(compose 内部服务名);server 加 resolve 以在 DNS 变化时刷新
upstream searxng_backend {
    zone searxng_backend 64k;
    server searxng:8080 resolve;
    keepalive 32;
}

upstream jina_backend {
    # jina 的 8080 是 HTTP/2(h2c),nginx 反代不支持;
    # 8081 是 jina 提供的 HTTP/1.1 备用服务器,nginx 用它反代。
    zone jina_backend 64k;
    server jina:8081 resolve;
    keepalive 32;
}

# 全局通用设置
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;

    # searxng 需要正确的请求头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 请求体大小限制
    client_max_body_size 10m;

    # ---------- MCP 网关:统一前缀 -> 外部 streamable-HTTP 服务 ----------
    # MCP 会话常在一次 initialize 后连续发多个 JSON-RPC/SSE 调用,因此不套用 web 限流,
    # 也不缓冲请求/响应;Connection 必须清空,避免 keep-alive 复用截断 SSE。
    # 上游虚拟主机按 Host 路由,因此这里保留 proxy_pass 的主机名,而不是入口 localhost。
    location = /mcp/context7 {
        absolute_redirect off;
        return 308 /mcp/context7/;
    }

    location = /mcp/wikidata {
        absolute_redirect off;
        return 308 /mcp/wikidata/;
    }

    location = /mcp/grep_app {
        absolute_redirect off;
        return 308 /mcp/grep_app/;
    }

    location /mcp/context7/ {
        rewrite ^/mcp/context7/$ /mcp break;
        rewrite ^/mcp/context7/(.*)$ /mcp/$1 break;
        proxy_pass https://mcp.context7.com;
        proxy_http_version 1.1;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection '';
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ssl_server_name on;
    }

    location /mcp/wikidata/ {
        rewrite ^/mcp/wikidata/(.*)$ /mcp/$1 break;
        proxy_pass https://wd-mcp.wmcloud.org;
        proxy_http_version 1.1;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection '';
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ssl_server_name on;
    }

    location /mcp/grep_app/ {
        rewrite ^/mcp/grep_app/$ / break;
        rewrite ^/mcp/grep_app/(.*)$ /$1 break;
        proxy_pass https://mcp.grep.app;
        proxy_http_version 1.1;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Host $proxy_host;
        proxy_set_header Connection '';
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ssl_server_name on;
    }

    # ---------- jina: /read/** -> <url> ----------
    # 剥掉 /read 前缀,把剩余目标 URL 映射到 jina 根路径 /<url>。
    location /read/ {
        limit_req zone=search_ratelimit burst=10 nodelay;
        rewrite ^/read/(.*)$ /$1 break;
        proxy_pass http://jina_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ---------- searxng: 原样转发(不剥前缀) ----------
    # 所有 searxng 路由(/search、/config、/static/、/preferences 等)原样透传。
    location / {
        limit_req zone=search_ratelimit burst=10 nodelay;
        proxy_pass http://searxng_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_read_timeout 60s;
    }
}
