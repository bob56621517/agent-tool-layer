# SearXNG 配置 —— agent-tool-layer 联网搜索工具层后端
#
# 装配方式:基于官方默认设定(use_default_settings),用 keep_only 只保留下方 engines 清单中的引擎,
# 其余 searxng 默认引擎全部排除,保证聚合干净。
#
# 环境变量注入(见 docker-compose.yml / .env.example):
#   SEARXNG_SECRET        服务端密钥(必需)
#   SEARXNG_BIND_ADDRESS  绑定地址(容器内不对外,由 nginx 反代)
#   SEARXNG_PORT          监听端口,默认 8080
#   SEARXNG_BASE_URL      对外 URL,用于生成正确链接
#   SEARXNG_LIMITER       是否开启 searxng 自身限流(本架构由 nginx 限流,保持 false)
#   BOCHA_API_KEY         博查密钥(bocha 兜底引擎,经 env 注入,不落文件)
#   GITHUB_TOKEN          github_code 引擎 token(经 entrypoint 注入,不落文件)

use_default_settings:
  engines:
    # 仅保留清单内的引擎,其余默认引擎(arxiv/flickr/google cse/brave 等)全部排除,
    # 保证聚合干净、只走常用源 + bocha 兜底 + GitHub。
    keep_only:
      - google
      - bing
      - baidu
      - duckduckgo
      - 360search
      - bocha
      - braveapi
      - github
      - github code

server:
  instance_name: "agent-tool-layer searxng"
  # 限流由 nginx 承担;searxng 关闭自身 limiter(无需 valkey,内部不识别客户端 IP)
  limiter: false
  # 绑定容器内地址,不对宿主暴露
  image_proxy: true

search:
  # 聚合默认源与兜底源;safe_search 走 moderate
  safe_search: 1
  # 必须显式声明允许的输出格式,否则格式会退化,format=json 会 403
  formats: [html, csv, json, rss]
  # 默认语言自适应
  default_lang: "auto"

# 对外出站请求的默认值
outgoing:
  # 请求超时
  request_timeout: 10.0
  # 连接/池化
  pool_connections: 20
  pool_maxsize: 20
  # 总请求重试次数
  max_retries: 2
  # 允许的 HTTP 方法
  enable_http: true

engines:
  # ---------- 常用聚合源 ----------
  - name: google
    engine: google
    shortcut: go
    categories: [general]
    disabled: false
    # 部分网络环境下 google 不稳定,交给权重与兜底处理
    weight: 1.0

  - name: bing
    engine: bing
    shortcut: bi
    categories: [general]
    disabled: false
    weight: 1.0

  - name: baidu
    engine: baidu
    shortcut: bd
    categories: [general]
    disabled: false
    weight: 1.0

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: [general]
    disabled: false
    weight: 1.0

  # ---------- 360 搜索(HTML 抓取,国内相对稳,不需 key)----------
  - name: 360search
    engine: 360search
    shortcut: 360so
    categories: [general]
    disabled: false
    timeout: 20.0

  # ---------- Brave Search API(官方 API,免费额度,稳定不被反爬)----------
  # 需 BRAVE_API_KEY(免费档 2000 次/月);经 env + entrypoint 注入 api_key 占位
  - name: braveapi
    engine: braveapi
    shortcut: bv
    categories: [general]
    inactive: false
    api_key: "$BRAVE_API_KEY"

  # ---------- 付费兜底:bocha(博查) ----------
  # 不用 ai-search,只用 web-search;key 由环境变量 BOCHA_API_KEY 注入
  - name: bocha
    engine: bocha
    shortcut: bch
    categories: [general]
    disabled: false
    # 兜底权重高于常用源,保证任何网络条件下都有结果
    weight: 3.0
    timeout: 10.0

  # ---------- GitHub 搜索 ----------
  # 仓库 + 代码两类,直接用 searxng 内置引擎,不自己实现
  - name: github
    engine: github
    shortcut: gh
    categories: [it, repos]
    disabled: false

  - name: github code
    engine: github_code
    shortcut: ghc
    categories: [it, code]
    disabled: false
    # github_code 需要认证才不被严格限流。内置引擎通过 ghc_auth 读取 token,不读环境变量。
    # 此处用占位符:$GITHUB_TOKEN 由 entrypoint(searxng/entrypoint.sh)在启动时注入。
    # 若环境变量 GITHUB_TOKEN 为空,entrypoint 会自动把 type 回退为 "none"(匿名限流),不报错。
    ghc_auth:
      type: "personal_access_token"
      token: "$GITHUB_TOKEN"
